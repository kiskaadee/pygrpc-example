[project]
name = "pygrpc"
version = "0.1.0"
description = "A learning project demonstrating Python gRPC services with Buf and uv"
readme = "README.md"
authors = [{ name = "kiskaadee", email = "fcortesbio@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["grpcio>=1.83.1", "protobuf>=7.36.1"]

[project.scripts]
pygrpc = "pygrpc:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "grpc-stubs>=1.53.0.6",
  "grpcio-tools>=1.83.1",
  "mypy-protobuf>=5.1.0",
  "pyright>=1.1.411",
  "ruff>=0.16.5",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src"]
exclude = ["**/__pycache__", "src/pygrpc/greeter/"]
ignore = ["src/pygrpc/greeter"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src/pygrpc/greeter/"]

[tool.ruff.lint]
select = ["E", "F", "I"] # Includes isort (I)
